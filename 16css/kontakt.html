<!DOCTYPE html>
<html>
<head>

    <title>CSS: Vježba 15 - kontakt</title>
    <meta charset="UTF-8">
    <meta name="description" content="CSS vježba 14">
    <meta name="keywords" content="HTML, CSS">
    <meta name="author" content="Mario Gabud">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="style.css">

 <style>
        /* OVDJE JE DODAN CSS KOD */

        /* 1. Reset osnovnih margina i paddinga za sve elemente */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 2. Osnovni stil za cijelu stranicu */
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }

        /* 3. Header dio stranice */
        header {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            margin: 24px auto 0;
            padding: 24px;
            max-width: 960px;
        }

        /* 4. Banner slika unutar headera */
        .banner img {
            width: 100%;
            display: block;
        }

        /* 5. Navigacija ispod bannera */
        nav {
            background-color: #1f3f78;
            padding: 12px 24px;
            margin-top: 16px;
        }

        /* 6. Lista u navigaciji */
        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        /* 7. Stavke liste u navigaciji */
        li {
            margin-right: 20px;
        }

        /* 8. Linkovi u navigaciji */
        a {
            text-decoration: none;
            color: #ffffff;
            border-bottom: 2px solid transparent;
            padding-bottom: 4px;
            font-size: 0.95rem;
        }

        a:hover {
            border-color: rgba(255, 255, 255, 0.8);
        }

        /* 9. Glavni sadržaj (main) */
        main {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            margin: 24px auto;
            padding: 24px;
            max-width: 960px;
        }

        /* 10. Tekst u glavnom sadržaju */
        main p {
            line-height: 1.5;
            margin-bottom: 10px;
            font-size: 16px;
        }

        /* 11. Footer */
        footer {
            text-align: center;
            font-size: 0.85rem;
            color: #666666;
            margin-bottom: 32px;
        }

        /* DODATNI STILOVI */
        main h1 {
            text-align: center;
            color: blue;
            margin-top: 10px;
            margin-bottom: 10px;
            font-size: 28px;
        }

        main h2 {
            margin-top: 15px;
            margin-bottom: 8px;
            color: #333333;
            font-size: 20px;
        }

        .uvod {
            font-style: italic;
            font-weight: bold;
            margin-bottom: 15px;
        }

        #osnovan {
            background-color: #ffffff;
            border: 1px solid #cccccc;
            padding: 8px;
            margin-bottom: 12px;
        }

        .vazno {
            color: green;
            font-weight: bold;
        }

        .lego-link {
            display: inline-block;
            margin-top: 10px;
            margin-bottom: 10px;
            text-decoration: none;
            border: 1px solid blue;
            padding: 5px 10px;
            color: blue;
            background-color: #ffffff;
        }

        .lego-slika {
            width: 300px;
            border: 1px solid #cccccc;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .lista-tema {
            margin-left: 20px;
            margin-bottom: 10px;
            list-style-type: square;
        }

        .napomena {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }

        /* STILOVI ZA TABLICU RASPOREDA */
        .raspored {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .raspored caption {
            margin-bottom: 5px;
            font-weight: bold;
        }

        .raspored th,
        .raspored td {
            border: 1px solid #cccccc;
            padding: 6px;
            text-align: center;
            font-size: 14px;
        }

        .raspored th {
            background-color: #fff7cc;
        }

    </style>
</head>
<body>

    <header>
        <div class="banner">
            <img src="lego_banner.jpg" alt="Lego">
        </div>

        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Početna</a></li>
                <li><a href="#">O nama</a></li>
                <li><a href="#">Radionice</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
                <li><a href="galerija.html">Galerija</a></li>
                <li><a href="https://www.lego.com" target="_blank">LEGO službena stranica</a></li>
            </ul>
        </nav>
    </header>

<section class="lego-contact">
            <h2>Kontaktirajte nas – LEGO podrška</h2>
            <p>Ako imate pitanje o svom LEGO setu, ispunite kontakt obrazac u nastavku.</p>
        
            <form class="lego-form" action="#" method="post">
                <div class="form-row">
                    <label for="first-name">Ime *</label>
                    <input type="text" id="first-name" name="first-name" placeholder="Vaše ime..." required>
                </div>
        
                <div class="form-row">
                    <label for="last-name">Prezime *</label>
                    <input type="text" id="last-name" name="last-name" placeholder="Vaše prezime..." required>
                </div>
        
                <div class="form-row">
                    <label for="email">Vaš e-mail *</label>
                    <input type="email" id="email" name="email" placeholder="Vaš e-mail..." required>
                </div>
        
                <div class="form-row">
                    <label for="country">Država</label>
                    <select id="country" name="country">
                        <option value="hrvatska">Hrvatska</option>
                        <option value="slovenija">Slovenija</option>
                        <option value="drugo">Drugo</option>
                    </select>
                </div>
        
                <div class="form-row">
                    <label for="subject">Poruka</label>
                    <textarea id="subject" name="subject" rows="5" placeholder="Napišite svoju poruku..."></textarea>
                </div>
        
                <div class="form-row">
                    <p><strong>Newsletter</strong></p>
                    <div class="option">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Želim primati LEGO novosti i popuste</label>
                    </div>
                </div>
        
                <div class="form-row">
                    <p><strong>Način dostave</strong></p>
                    <div class="option">
                        <input type="radio" id="delivery-standard" name="delivery" value="standardna" checked>
                        <label for="delivery-standard">Standardna dostava</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="delivery-express" name="delivery" value="ekspresna">
                        <label for="delivery-express">Ekspresna dostava</label>
                    </div>
                </div>
        
                <div class="form-row">
                    <label for="promo-code">Promo kod (onemogućeno polje)</label>
                    <input type="text" id="promo-code" name="promo-code" value="USKORO" disabled>
                </div>
        
                <div class="form-row">
                    <button type="submit" class="btn-send">Pošalji</button>
                </div>
            </form>
        </section>

    <footer>
        &copy; Mario Gabud
    </footer>
</body>
</html>
