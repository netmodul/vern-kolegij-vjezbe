<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="CSS vježba 12">
        <meta name="keywords" content="HTML, CSS">
        <meta name="author" content="Mario Gabud">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>CSS: Vježba 12</title>

 <style>
        /* OVDJE JE DODAN CSS KOD */

        /* 1. Reset osnovnih margina i paddinga za sve elemente */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 2. Osnovni stil za cijelu stranicu */
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }

        /* 3. Header dio stranice */
        header {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            margin: 24px auto 0;
            padding: 24px;
            max-width: 960px;
        }

        /* 4. Banner slika unutar headera */
        .banner img {
            width: 100%;
            display: block;
        }

        /* 5. Navigacija ispod bannera */
        nav {
            background-color: #1f3f78;
            padding: 12px 24px;
            margin-top: 16px;
        }

        /* 6. Lista u navigaciji */
        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        /* 7. Stavke liste u navigaciji */
        li {
            margin-right: 20px;
        }

        /* 8. Linkovi u navigaciji */
        a {
            text-decoration: none;
            color: #ffffff;
            border-bottom: 2px solid transparent;
            padding-bottom: 4px;
            font-size: 0.95rem;
        }

        a:hover {
            border-color: rgba(255, 255, 255, 0.8);
        }

        /* 9. Glavni sadržaj (main) */
        main {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            margin: 24px auto;
            padding: 24px;
            max-width: 960px;
        }

        /* 10. Tekst u glavnom sadržaju */
        main p {
            line-height: 1.6;
        }

        /* 11. Footer */
        footer {
            text-align: center;
            font-size: 0.85rem;
            color: #666666;
            margin-bottom: 32px;
        }
    </style>
</head>
<body>

    <header>
        <div class="banner">
            <img src="lego_banner.jpg" alt="Lego">
        </div>

        <nav class="main-nav">
            <ul>
                <li><a href="#">Početna</a></li>
                <li><a href="#">O nama</a></li>
                <li><a href="#">Usluge</a></li>
                <li><a href="#">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <p>Ovdje će ići ostatak sadržaja stranice.</p>
    </main>

    <footer>
        &copy; Mario Gabud
    </footer>
</body>
</html>
